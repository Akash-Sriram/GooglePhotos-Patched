name: Build, Patch and Release Google Photos

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:
    inputs:
      direct_apk_url:
        description: 'Direct APK Download URL (Optional fallback if APKMirror scraping fails)'
        required: false
        type: string
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build-and-patch:
    name: Build Patch & Release Google Photos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      actions: write
    steps:
      - name: Checkout Release Repository
        uses: actions/checkout@v4

      - name: Checkout Patches Repository (Morphe Google Photos)
        uses: actions/checkout@v4
        with:
          repository: 'Akash-Sriram/morphe-google-photos'
          path: 'morphe-google-photos'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi playwright
          playwright install chromium --with-deps


      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3
        with:
          build-root-directory: morphe-google-photos

      - name: Overlay Custom Patches from GooglePhotos-Patched into morphe-google-photos
        run: |
          if [ -d "custom-patches" ]; then
            echo "Copying custom-patches into morphe-google-photos..."
            cp -r custom-patches/* morphe-google-photos/
          fi

      - name: Build Morphe Patches from morphe-google-photos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd morphe-google-photos
          chmod +x gradlew
          ./gradlew :extensions:shared:syncExtension :patches:buildAndroid generatePatchesList -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }}

      - name: Locate Patch Bundle
        id: locate_patch
        run: |
          PATCH_FILE=$(find morphe-google-photos/patches/build/libs \( -name "patches-*.mpp" -o -name "patches-*.jar" \) | grep -v "\-sources" | grep -v "\-javadoc" | head -n 1)
          if [ -z "$PATCH_FILE" ]; then
            echo "Error: Patch file not found!"
            exit 1
          fi
          echo "PATCH_PATH=$PATCH_FILE" >> $GITHUB_ENV
          echo "Found patch file: $PATCH_FILE"

      - name: Setup Morphe CLI
        run: |
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | grep "browser_download_url.*morphe-desktop.*all.jar" | cut -d '"' -f 4 | head -n 1)
          if [ -z "$CLI_URL" ]; then
            CLI_URL="https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar"
          fi
          echo "Downloading Morphe Desktop CLI from $CLI_URL"
          curl -L -o morphe-cli.jar "$CLI_URL"

      - name: Download Google Photos APK
        id: download_apk
        run: |
          DIRECT_URL="${{ inputs.direct_apk_url }}"
          if [ -n "$DIRECT_URL" ]; then
            python .github/scripts/download_apk.py --direct-url "$DIRECT_URL" --output google-photos-base.apk
          else
            python .github/scripts/download_apk.py --output google-photos-base.apk
          fi

      - name: Extract Actual APK Version
        id: get_apk_ver
        run: |
          AAPT_PATH=$(find $ANDROID_HOME/build-tools -name "aapt" | sort -V | tail -n 1)
          APK_VER=$($AAPT_PATH dump badging google-photos-base.apk | grep -oP "versionName='\K[^']+")
          echo "Actual APK version extracted: $APK_VER"
          echo "apk_version=$APK_VER" >> $GITHUB_OUTPUT

      - name: Check Existing Release
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_VER="${{ steps.get_apk_ver.outputs.apk_version }}"
          if [ -n "$APK_VER" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            TAG="v${APK_VER}"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Release $TAG already exists in ${{ github.repository }}. Skipping duplicate build."
              echo "skip=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Patch Google Photos APKs (Mod & Original)
        if: steps.check_release.outputs.skip != 'true'
        run: |
          echo "🧩 [1/2] Building Mod Package (app.morphe.android.apps.photos)..."
          java -jar morphe-cli.jar patch \
            -p "${{ env.PATCH_PATH }}" \
            -d "Disable Play Store updates" \
            --unsigned \
            -o patched-mod-unsigned.apk \
            google-photos-base.apk

          echo "🧩 [2/2] Building Original Package (com.google.android.apps.photos)..."
          java -jar morphe-cli.jar patch \
            -p "${{ env.PATCH_PATH }}" \
            -d "Change package name" \
            -e "Disable Play Store updates" \
            --unsigned \
            -o patched-original-unsigned.apk \
            google-photos-base.apk

      - name: Sign Patched APKs
        if: steps.check_release.outputs.skip != 'true'
        run: |
          # Decode keystore from secret
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

          # Determine version string and sanitize trailing dots
          APK_VER="${{ steps.get_apk_ver.outputs.apk_version }}"
          APK_VER=$(echo "$APK_VER" | sed -e 's/[^0-9.]//g' -e 's/\.*$//')
          if [ -z "$APK_VER" ]; then
            APK_VER="build-${{ github.run_number }}"
          fi
          OUT_MOD="GooglePhotos-v${APK_VER}-mod.apk"
          OUT_ORIGINAL="GooglePhotos-v${APK_VER}-original.apk"
          echo "RELEASE_APK_MOD=${OUT_MOD}" >> $GITHUB_ENV
          echo "RELEASE_APK_ORIGINAL=${OUT_ORIGINAL}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${APK_VER}" >> $GITHUB_ENV

          # Find zipalign & apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          for FLAVOR in mod original; do
            echo "Processing and signing ${FLAVOR} package..."
            $BUILD_TOOLS_DIR/zipalign -v 4 patched-${FLAVOR}-unsigned.apk patched-${FLAVOR}-aligned.apk

            # Repack aligned APK to fix local file header / central directory zip mismatches (e.g. assets/AltFormats_27)
            python -c "import zipfile; in_zip = zipfile.ZipFile('patched-${FLAVOR}-aligned.apk', 'r'); out_zip = zipfile.ZipFile('patched-${FLAVOR}-aligned-fixed.apk', 'w', compression=zipfile.ZIP_DEFLATED); [out_zip.writestr(item, in_zip.read(item.filename)) for item in in_zip.infolist()]; in_zip.close(); out_zip.close()"
            mv patched-${FLAVOR}-aligned-fixed.apk patched-${FLAVOR}-aligned.apk

            TARGET_OUT=$([ "$FLAVOR" = "mod" ] && echo "$OUT_MOD" || echo "$OUT_ORIGINAL")
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out "${TARGET_OUT}" patched-${FLAVOR}-aligned.apk
          done
          
          # Clean up decrypted keystore
          rm -f release.keystore

      - name: Upload Mod APK Artifact
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_APK_MOD }}
          path: ${{ env.RELEASE_APK_MOD }}

      - name: Upload Original APK Artifact
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_APK_ORIGINAL }}
          path: ${{ env.RELEASE_APK_ORIGINAL }}

      - name: Publish or Update Patched APK Release
        if: steps.check_release.outputs.skip != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.RELEASE_VERSION }}"
          TITLE="Google Photos v${{ env.RELEASE_VERSION }}"
          APK_MOD="${{ env.RELEASE_APK_MOD }}"
          APK_ORIGINAL="${{ env.RELEASE_APK_ORIGINAL }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Overwriting APK assets..."
            gh release upload "$TAG" "$APK_MOD" "$APK_ORIGINAL" --clobber
            gh release edit "$TAG" --title "$TITLE" --latest
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$APK_MOD" "$APK_ORIGINAL" --title "$TITLE" --latest
          fi

